spring:
  application:
    name: artgallery-backend
  datasource:
    # Values are resolved from environment variables when present, so no
    # credentials live in source control. See backend/.env.example.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/artgallery_db}
    username: ${DB_USERNAME:artgallery_user}
    password: ${DB_PASSWORD:artgallery_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      pool-name: ArtGalleryHikariPool
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: false   # set to true behind HTTPS in production
      timeout: 30m

server:
  port: 8080
  error:
    # Never leak stack traces to clients
    include-stacktrace: never
    include-message: never

logging:
  level:
    com.artgallery: INFO
    org.springframework.jdbc: WARN

app:
  # Directory holding database/schema.sql and database/seed.sql, used by the
  # ADMIN-only reset endpoint. Relative to the backend working directory.
  sql-dir: ${SQL_DIR:../database}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
